
<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менин биринчи сайтым</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      color: #333;
      min-height: 100vh;
    }

    header {
      padding: 25px;
      background: rgba(255,255,255,0.3);
    }

    .card {
      background: white;
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px #0002;
    }

    button {
      background: #8e44ad;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #6c3483;
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ Менин биринчи сайтым ✨</h1>
  </header>

  <div class="card">
    <h2>Кош келиңиз! 💜</h2>
    <p>Бул мен өзүм жасаган биринчи сайт.</p>
    <p>Сайт жасоо абдан кызыктуу!</p>
    <button onclick="alert('Салам! Сайтыма кош келиңиз! ❤️')">
      Мени бас!
    </button>
  </div>
</body>
</html>
